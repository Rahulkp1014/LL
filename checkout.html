<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Luster Lane</title>
    <link rel="stylesheet" href="checkout-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <main class="checkout-container">
        <div class="checkout-details">
            <div class="logo">
                <a href="index.php">Luster Lane</a>
            </div>
            
            <form id="checkout-form">
                <!-- Contact Information -->
                <section>
                    <h2>Contact Information</h2>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                </section>

                <!-- Shipping Address -->
                <section>
                    <h2>Shipping Address</h2>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" placeholder="Street address" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" required>
                        </div>
                        <div class="form-group">
                            <label for="zip">Postal Code</label>
                            <input type="text" id="zip" required>
                        </div>
                    </div>
                </section>
                
                <!-- Payment Information -->
                <section>
                    <h2>Payment Details</h2>
                    <p class="payment-note">For demonstration purposes only. Do not enter real credit card details.</p>
                    <div class="form-group">
                        <label for="card-number">Card Number</label>
                        <input type="text" id="card-number" placeholder="xxxx xxxx xxxx xxxx" required>
                    </div>
                     <div class="form-row">
                        <div class="form-group">
                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" placeholder="MM / YY" required>
                        </div>
                        <div class="form-group">
                            <label for="cvc">CVC</label>
                            <input type="text" id="cvc" placeholder="123" required>
                        </div>
                    </div>
                </section>
                
                <p id="form-feedback" class="form-feedback"></p>
                <button type="submit" id="place-order-btn" class="submit-btn">Place Order</button>
            </form>
        </div>

        <div class="order-summary">
            <h3>Your Order</h3>
            <div id="summary-items">
                <!-- Cart items will be injected here by JavaScript -->
            </div>
            <div class="summary-totals">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">$0.00</span>
                </div>
                 <div class="summary-row">
                    <span>Shipping</span>
                    <span>FREE</span>
                </div>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="summary-total">$0.00</span>
                </div>
            </div>
        </div>
    </main>

    <script src="checkout.js"></script>

</body>
</html>
