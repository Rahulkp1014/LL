<section class="section-padding container">

                style="font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 2rem; color: var(--primary-color);">

            <div style="margin-bottom: 1.5rem;">
                <strong
                    style="display: block; color: var(--primary-color); font-weight: 600; margin-bottom: 0.3rem;">Address</strong>
                <p style="color: var(--text-secondary);">123 Jewelry Lane, Surat, Gujarat, India</p>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <strong
                    style="display: block; color: var(--primary-color); font-weight: 600; margin-bottom: 0.3rem;">Email</strong>
                <p style="color: var(--text-secondary);">support@lusterlane.com</p>

            <div style="margin-bottom: 2.5rem;">
                <strong
                    style="display: block; color: var(--primary-color); font-weight: 600; margin-bottom: 0.3rem;">Phone</strong>
                <p style="color: var(--text-secondary);">+91 123 456 7890</p>

        <div

                    style="font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 2rem; color: var(--primary-color);">

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" class="form-control" required>
                </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-control" rows="6" required
